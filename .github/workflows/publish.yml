name: Collect prices and publish

on:
  push:
    branches: [main]
  schedule:
    # Hourly, at :17 JST. Actual execution may be delayed.
    - cron: '17 * * * *'
      timezone: 'Asia/Tokyo'
  workflow_dispatch:
    inputs:
      collect:
        type: boolean
        description: 'Collect prices before publishing'
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: market-tracker-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect price data
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.collect) }}
        env:
          AUTHORIZED_PRICE_FEED_URL: ${{ secrets.AUTHORIZED_PRICE_FEED_URL }}
          AUTHORIZED_PRICE_FEED_TOKEN: ${{ secrets.AUTHORIZED_PRICE_FEED_TOKEN }}
        run: node scripts/collect.mjs
      - name: Commit new history
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.collect) }}
        run: |
          if ! git diff --quiet -- public/data/prices.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/data/prices.json
            git commit -m "data: refresh market history"
            git push origin HEAD:main
          fi
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
