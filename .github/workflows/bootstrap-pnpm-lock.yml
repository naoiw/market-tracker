name: Bootstrap pnpm lockfile
on:
  push:
    branches: [develop]
    paths:
      - package.json
      - .github/workflows/bootstrap-pnpm-lock.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate deterministic lockfile
        run: pnpm install --lockfile-only --ignore-scripts
      - name: Commit generated lockfile
        run: |
          if ! git diff --quiet -- pnpm-lock.yaml || [ ! -f pnpm-lock.yaml ] || ! git ls-files --error-unmatch pnpm-lock.yaml >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "build: generate pnpm lockfile"
            git push origin HEAD:develop
          fi
